apply plugin: 'com.android.application'
apply plugin:  'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
android {
    namespace 'com.bumbumapps.bouncy'
    compileSdk 36

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
    lint {
        abortOnError false
    }
    packaging {
        jniLibs {
            // Uncompressed, page-aligned native libs (16 KB page size devices).
            useLegacyPackaging = false
        }
    }

    defaultConfig {
        applicationId "com.bumbumapps.pinball"
        minSdk 24
        targetSdk 36
        // Play: versionCode 6 submitted 2026-10-26.
        versionCode 7
        versionName "1.1.1"
        multiDexEnabled true
    }

    buildTypes {
        debug {
            // Google test ads in debug builds.
            manifestPlaceholders = [admobAppId: "ca-app-pub-3940256099942544~3347511713"]
            resValue "string", "admob_banner_id", "ca-app-pub-3940256099942544/9214589741"
            resValue "string", "admob_interstitial_id", "ca-app-pub-3940256099942544/1033173712"
        }
        release {
            manifestPlaceholders = [admobAppId: "ca-app-pub-8444865753152507~5380880963"]
            resValue "string", "admob_banner_id", "ca-app-pub-8444865753152507/9690309995"
            resValue "string", "admob_interstitial_id", "ca-app-pub-8444865753152507/5420672743"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
}

ext {
    gdxVersion = '1.14.2'
}

configurations { natives }

// libgdx native libraries are copied to libs/ by the copyAndroidNatives task.
// desugar_jdk_libs 2.0.0 is available as of Oct 2022, but produces build errors.
dependencies {
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
    // libGDX >= 1.12 Box2D calls into libgdx.so (BufferUtils), so ship the core natives too.
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-x86_64"
    implementation 'androidx.core:core:1.17.0'
    implementation 'com.google.android.play:review:2.0.2'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    implementation platform('com.google.firebase:firebase-bom:34.4.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
}

// From https://github.com/libgdx/libgdx/blob/master/extensions/gdx-setup/res/com/badlogic/gdx/setup/resources/android/build.gradle
tasks.register('copyAndroidNatives') {
  doLast {
    file("libs/armeabi-v7a/").mkdirs()
    file("libs/arm64-v8a/").mkdirs()
    file("libs/x86/").mkdirs()
    file("libs/x86_64/").mkdirs()

    configurations.getByName("natives").copy().files.each { jar ->
        def outputDir = null
        if (jar.name.endsWith("natives-armeabi-v7a.jar")) outputDir = file("libs/armeabi-v7a")
        if (jar.name.endsWith("natives-arm64-v8a.jar")) outputDir = file("libs/arm64-v8a")
        if (jar.name.endsWith("natives-x86.jar")) outputDir = file("libs/x86")
        if (jar.name.endsWith("natives-x86_64.jar")) outputDir = file("libs/x86_64")
        if (outputDir != null) {
            copy {
                from zipTree(jar)
                into outputDir
                include "*.so"
            }
        }
    }
  }
}

tasks.matching { it.name.contains("merge") && it.name.contains("JniLibFolders") || it.name.contains("package") }.configureEach {
    it.dependsOn 'copyAndroidNatives'
}
